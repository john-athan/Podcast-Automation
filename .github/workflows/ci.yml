name: CI

# A caller, never a container. The checks live in tools/validate.sh, so the same
# ones run here and on the machine this is developed on, with `oss check
# Podcast-Automation`. That matters more here than anywhere else in the fleet:
# mlx-audio has no Linux wheels, so this runner can only prove the sources parse
# and the package imports. The script knows that and does more where more is
# possible.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Validate
        run: tools/validate.sh
