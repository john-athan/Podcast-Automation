name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Sundays 03:47 UTC, finished before the 06:00 Berlin
    # Dependabot window so Sunday morning shows scans and PRs together.
    - cron: "47 3 * * 0"

permissions:
  # Required by the reusable workflows to upload results to code scanning.
  actions: read
  contents: read
  security-events: write

jobs:
  # Full recursive scan (pyproject.toml / any manifests) on push + weekly cron.
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1

  # Diff-aware scan on pull requests.
  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
