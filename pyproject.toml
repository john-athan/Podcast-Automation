[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podcast-automation"
version = "2.0.2"
description = "Fully-local news-bulletin generator: RSS -> LM Studio script -> VibeVoice MLX audio."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.8",      # full article text extraction
    "openai>=1.51",          # client only; points at local LM Studio
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "mlx-audio>=0.2",        # VibeVoice on Apple Silicon
    "soundfile>=0.12",
    "numpy>=1.26",
    # Security floor for a transitive dependency: torch arrives via
    # mlx-audio -> mlx-whisper. 2.13.0 is the release that fixes PYSEC-2025-194.
    # See https://osv.dev/vulnerability/PYSEC-2025-194
    "torch>=2.13.0",
]

[project.optional-dependencies]
publish = [                    # Google Drive upload (optional)
    # Not PyDrive2: its final release (1.21.3) caps cryptography<44 and
    # pyopenssl<=24.2.1, pinning both to versions with known CVEs.
    "google-api-python-client>=2.198",
    "google-auth-oauthlib>=1.2",
    # Security floor for a transitive dependency: cryptography arrives via
    # google-api-python-client -> google-api-core -> google-auth. 49.0.0 is the
    # release that clears the last of PYSEC-2026-1284/2141/35/3553/3554.
    "cryptography>=49.0.0",
]
web = [                        # local web console
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",  # includes websockets for live progress
]

[project.scripts]
podcast = "podcast.pipeline:main"
podcast-web = "podcast.web.__main__:main"

[dependency-groups]
# Dev tooling (PEP 735). Install with `uv sync` (included by default) or
# skip with `uv sync --no-dev`.
# Pinned, not floored: CI lints with this exact version (see .github/workflows/ci.yml),
# so a new ruff release cannot turn main red without a deliberate bump.
dev = ["ruff==0.16.6"]

[tool.hatch.build.targets.wheel]
# Ships the whole `podcast` package, including podcast/web/static/* assets.
packages = ["podcast"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Every `except Exception` in this package is a deliberate degrade-don't-crash
# boundary: a dead RSS feed, an unreachable LM Studio, a truncated WAV, a
# disconnected websocket. None of them swallows the error silently; each logs,
# reports it to the caller, or returns a sentinel the caller handles. Narrowing
# them to specific types would turn a pipeline built to survive partial failure
# into one that dies on an unanticipated errno.
ignore = ["BLE001"]
